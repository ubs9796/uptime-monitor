name: Uptime & SSL Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore SQLite state cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            uptime.db
            uptime.db-wal
            uptime.db-shm
          key: uptime-db-${{ github.run_id }}
          restore-keys: |
            uptime-db-

      - name: Seed sites from sites.json
        run: |
          if [ ! -f sites.json ]; then
            echo "sites.json is not present; skipping seed."
            exit 0
          fi
          python3 - << 'PY'
          import json
          import sqlite3
          from storage import add_site, connect_db, init_db

          conn = connect_db("uptime.db")
          init_db(conn)
          with open("sites.json", "r", encoding="utf-8") as f:
              sites = json.load(f)
          for item in sites:
              try:
                  add_site(conn, item["client_name"], item["url"])
                  print(f"Seeded: {item['client_name']}")
              except sqlite3.IntegrityError:
                  pass
          conn.close()
          PY

      - name: Run uptime and SSL checks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 runner.py check --ssl-warn-days 14
          python3 runner.py list
